# Tomcat
server:
  port: 9208

# Spring
spring: 
  application:
    # 应用名称
    name: xingqiao-order
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 47.115.48.217:9003
        ip: 127.0.0.1
        username: nacos
        password: Zding2025!
      config:
        # 配置中心地址
        server-addr: 47.115.48.217:9003
        username: nacos
        password: Zding2025!
        # 配置文件格式
        file-extension: yml
        # 配置的Group，默认为DEFAULT_GROUP
        group: DEFAULT_GROUP
        # 命名空间，用于隔离不同环境的配置
        namespace: public
        # 配置的自动刷新
        refresh-enabled: true
        # 共享配置，用于加载应用通用配置和MSN相关配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          - application-msn-${spring.profiles.active}.yml