<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>客户邀请</title>
    <style>
        .container { max-width: 600px; margin: 20px auto; padding: 20px; font-family: 微软雅黑, sans-serif; border: 1px solid #eee; }
        .title { color: #2c3e50; font-size: 18px; }
        .invite-link { color: #3498db; font-size: 16px; margin: 15px 0; word-break: break-all; }
        .tip { color: #7f8c8d; font-size: 14px; line-height: 1.6; }
        .button { display: inline-block; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <p class="title">您好，诚邀您加入星桥理财</p>
    <p>您的专属理财顾问邀请您体验我们的专业理财服务。</p>
    
    <p>点击下方按钮或复制链接到浏览器访问：</p>
    <p><a href="{inviteLink}" class="button">点击注册</a></p>
    
    <p class="tip">
        • 本邀请链接仅限您本人使用；<br>
        • 点击链接可了解我们的理财产品和服务；<br>
        • 如有任何疑问，请联系您的专属理财顾问或客服。<br>
    </p>
    <p>客服电话：17665319189 <br>星桥理财版权所有</p>
</div>
</body>
</html>
